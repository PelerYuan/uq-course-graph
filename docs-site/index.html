<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UQ Course Graph Documentation</title>
  <meta name="description" content="A complete guide to collecting UQ course data, parsing prerequisites, building dependency graphs, and exploring curriculum networks with R.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #1976d2; --base-font-size: 16px; --sidebar-width: 300px; }
    .sidebar { position: fixed !important; left: 0 !important; top: 0 !important; bottom: 0 !important; margin: 0 !important; }
    .content { left: 300px !important; }
    .markdown-section { max-width: 1180px; }
    .markdown-section img { border: 1px solid #e0e0e0; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .markdown-section .hero-image { display: block; width: 100%; max-width: 1500px; max-height: 68vh; object-fit: contain; margin: 1.5rem auto 2.5rem; border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.16); }
    .markdown-section pre > code { font-size: 0.9em; }
    @media screen and (max-width: 768px) {
      .content { left: 0 !important; }
      .sidebar { left: -300px !important; }
      body.close .sidebar { left: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="app">Loading documentation...</div>
  <script>
    window.$docsify = {
      name: 'UQ Course Graph',
      repo: 'PelerYuan/uq-course-graph',
      loadSidebar: true,
      loadNavbar: true,
      homepage: 'README.md',
      subMaxLevel: 3,
      auto2top: true,
      search: { paths: 'auto', placeholder: 'Search the documentation', noData: 'No results' },
      copyCode: { buttonText: 'Copy', successText: 'Copied' },
      pagination: { previousText: 'Previous', nextText: 'Next', crossChapter: true },
      themeColor: '#1976d2',
      mermaid: { theme: 'default' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-r.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
</body>
</html>
