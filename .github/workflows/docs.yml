name: Deploy documentation
on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - 'scripts/check_docs.py'
      - 'scripts/build_gallery.py'
      - 'examples/gallery/**'
      - 'examples/gallery.R'
      - 'examples/gallery_courses.csv'
      - '.github/workflows/docs.yml'
      - 'browser-tests/**'
      - 'playwright.config.cjs'
      - 'package*.json'
      - 'scripts/serve_docs.cjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check documentation links and images
        run: python3 scripts/check_docs.py
      - name: Check gallery code and documentation are synchronized
        run: python3 scripts/build_gallery.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile navigation under the deployment subpath
        run: npm run test:docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: docs-browser-report
          path: playwright-report
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
