name: R checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::testthat any::dplyr any::stringr any::tibble any::tidyr any::jsonlite any::tidygraph any::igraph any::ggraph any::ggplot2 any::scales any::RColorBrewer any::rvest any::httr any::chromote
      - name: Parse R files
        shell: Rscript {0}
        run: |
          files <- list.files(pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          for (f in files) parse(file = f)
      - name: Run tests
        shell: Rscript {0}
        run: |
          testthat::test_dir("tests/testthat", reporter = "summary")
