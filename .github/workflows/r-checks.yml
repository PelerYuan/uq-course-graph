name: R checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check generated API documentation
        run: |
          Rscript scripts/document.R
          Rscript scripts/build_reference.R --check
          git diff --exit-code -- NAMESPACE man
      - name: Verify source workflow offline
        run: Rscript scripts/verify_workflow.R
      - name: Verify installed package outside the source checkout
        run: |
          R CMD INSTALL .
          Rscript scripts/verify_installed.R
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
